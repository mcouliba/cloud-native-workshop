<header role="banner" class="pf-c-page__header coolstore-header">
  <div class="coolstore-header__inner">
    <a class="coolstore-brand" href="#/" aria-label="Go to CoolStore home">
      <img class="coolstore-brand__logo" src="/app/imgs/logo.png" alt="Red Hat logo" />
      <div class="coolstore-brand__text">
        <span class="coolstore-brand__title">CoolStore</span>
        <span class="coolstore-brand__subtitle">Modern tech merch</span>
      </div>
    </a>

    <nav class="coolstore-nav" aria-label="Primary">
      <a href="#/" class="coolstore-nav__link" ng-class="{'is-active': isActive('/')}">Shop</a>
      <a href="#/" class="coolstore-nav__link">Top Picks</a>
      <a href="#/" class="coolstore-nav__link">Bundles</a>
    </nav>

    <div class="coolstore-header__actions">
      <button
        type="button"
        class="coolstore-btn coolstore-btn--ghost"
        ng-if="ssoEnabled() && !isLoggedIn()"
        ng-click="login()"
      >
        Sign in
      </button>
      <button
        type="button"
        class="coolstore-btn coolstore-btn--ghost"
        ng-if="ssoEnabled() && isLoggedIn()"
        ng-click="profile()"
      >
        {{userInfo.preferred_username || 'Profile'}}
      </button>
      <button
        type="button"
        class="coolstore-btn coolstore-btn--primary"
        ng-if="ssoEnabled() && isLoggedIn()"
        ng-click="logout()"
      >
        Sign out
      </button>
      <button type="button" class="coolstore-btn coolstore-btn--primary" ng-if="!ssoEnabled()">
        Start shopping
      </button>
    </div>
  </div>
</header>
